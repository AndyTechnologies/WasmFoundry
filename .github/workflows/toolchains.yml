name: Toolchains
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: toolchains-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  rust:
    name: Rust toolchain
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Rust toolchain with WASM target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Ensure WASM target is installed
      shell: bash
      run: |
        set -Eeuo pipefail
        rustup target add wasm32-unknown-unknown
        rustup target list --installed
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path:
        - ~/.cargo/registry
        - ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-cargo-
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-target-rust-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-target-rust-
    - name: Build wf binary
      run: cargo build --release -p wf-cli
    - name: Test Rust toolchain
      shell: bash
      run: |
        set -Eeuo pipefail
        WF="${GITHUB_WORKSPACE}/target/release/wf"

        mkdir -p toolchain-rust

        cd toolchain-rust

        # Write wasmfoundry.toml

        cat > wasmfoundry.toml <<'EOF'

        schema = 1

        [package]

        name = "rust-toolchain-test"

        version = "0.1.0"

        [project]

        source_dir = "src"

        entry = "_start"

        [[module]]

        name = "hello"

        source = "src/lib.rs"

        toolchain = "rust"

        EOF

        # Write Cargo.toml

        mkdir -p src

        cat > src/Cargo.toml <<'EOF'

        [package]

        name = "hello"

        version = "0.1.0"

        edition = "2021"

        [lib]

        crate-type = ["cdylib"]

        [workspace]

        EOF

        # Write lib.rs

        mkdir -p src/src

        cat > src/src/lib.rs <<'EOF'

        #[no_mangle]

        pub extern "C" fn _start() -> i32 { 123 }

        EOF

        $WF build

        test -f target/hello.wasm

        $WF run

        echo "Rust toolchain test passed"
  cpp:
    name: C++ toolchain (clang++)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Rust toolchain (for wf binary)
      uses: dtolnay/rust-toolchain@stable
    - name: Build wf binary
      run: cargo build --release -p wf-cli
    - name: Install wasi-sdk
      shell: bash
      run: |
        set -Eeuo pipefail

        WASI_SDK_VERSION=25
        ARCHIVE="wasi-sdk-${WASI_SDK_VERSION}.0-linux.tar.gz"
        URL="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/${ARCHIVE}"

        curl \
          --fail \
          --location \
          --retry 5 \
          --retry-all-errors \
          --output "$RUNNER_TEMP/$ARCHIVE" \
          "$URL"

        # Verify SHA-256 against the checksum published
        # by the corresponding official release.

        sha256sum "$RUNNER_TEMP/$ARCHIVE"

        tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP"

        SDK_DIR="$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}.0"

        test -x "$SDK_DIR/bin/clang"

        echo "$SDK_DIR/bin" >> "$GITHUB_PATH"

        "$SDK_DIR/bin/clang" --version

    - name: Test C++ toolchain
      shell: bash
      run: |
        set -Eeuo pipefail
        WF="${GITHUB_WORKSPACE}/target/release/wf"

        mkdir -p toolchain-cpp

        cd toolchain-cpp

        # Write wasmfoundry.toml

        cat > wasmfoundry.toml <<'EOF'

        schema = 1

        [package]

        name = "cpp-toolchain-test"

        version = "0.1.0"

        [project]

        source_dir = "."

        entry = "_start"

        [[module]]

        name = "hello"

        source = "main.cpp"

        toolchain = "cpp"

        EOF

        # Write main.cpp

        mkdir -p src

        cat > src/main.cpp <<'EOF'

        extern "C" int _start() { return 456; }

        EOF

        $WF build

        test -f target/hello.wasm

        $WF run

        echo "C++ toolchain test passed"
  assemblyscript:
    name: AssemblyScript toolchain (asc)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Rust toolchain (for wf binary)
      uses: dtolnay/rust-toolchain@stable
    - name: Install Node.js (LTS)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install AssemblyScript
      shell: bash
      run: npm install -g assemblyscript@1.2.0
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path:
        - ~/.cargo/registry
        - ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-cargo-
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-target-as-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-target-as-
    - name: Build wf binary
      run: cargo build --release -p wf-cli
    - name: Test AssemblyScript toolchain
      shell: bash
      run: |
        set -Eeuo pipefail
        WF="${GITHUB_WORKSPACE}/target/release/wf"

        mkdir -p toolchain-as

        cd toolchain-as

        # Write wasmfoundry.toml

        cat > wasmfoundry.toml <<'EOF'

        schema = 1

        [package]

        name = "as-toolchain-test"

        version = "0.1.0"

        [project]

        source_dir = "src"

        entry = "_start"

        [[module]]

        name = "hello"

        source = "src/hello.ts"

        toolchain = "assemblyscript"

        EOF

        # Write hello.ts

        mkdir -p src

        cat > src/hello.ts <<'EOF'

        export function _start(): i32 { return 789; }

        EOF

        $WF build

        test -f target/hello.wasm

        $WF run

        echo "AssemblyScript toolchain test passed"
  toolchains:
    name: Toolchains Summary
    runs-on: ubuntu-latest
    needs:
    - rust
    - cpp
    - assemblyscript
    if: always()
    steps:
    - name: Check all toolchain jobs passed
      shell: bash
      env:
        RUST_RESULT: ${{ needs.rust.result }}
        CPP_RESULT: ${{ needs.cpp.result }}
        AS_RESULT: ${{ needs.assemblyscript.result }}
      run: |
        set -Eeuo pipefail

        for result in \
          "$RUST_RESULT" \
          "$CPP_RESULT" \
          "$AS_RESULT"
        do
          if [[ "$result" != "success" ]]; then
            echo "::error::A toolchain job did not succeed: $result"
            exit 1
          fi
        done

        echo "All toolchain tests passed"