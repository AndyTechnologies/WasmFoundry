# WasmFoundry Multi-Toolchain CI
#
# Tests each guest toolchain (Rust, C++, AssemblyScript) with only the
# dependencies that toolchain needs. This follows plan.md §124.

name: Toolchains

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-rust-
      - name: Build wf binary
        run: cargo build --release -p wf-cli
      - name: Test Rust toolchain
        run: |
          set -euo pipefail
          WF=$(pwd)/target/release/wf
          mkdir -p toolchain-rust
          cd toolchain-rust
          printf 'schema = 1\n[package]\nname = "rust-toolchain-test"\nversion = "0.1.0"\n[project]\nsource_dir = "src"\nentry = "_start"\n[[module]]\nname = "hello"\nsource = "src"\ntoolchain = "rust"\n' > wasmfoundry.toml
          mkdir -p src
          printf '[package]\nname = "hello"\nversion = "0.1.0"\nedition = "2021"\n[lib]\ncrate-type = ["cdylib"]\n' > src/Cargo.toml
          mkdir -p src/src
          printf '#[no_mangle]\npub extern "C" fn _start() -> i32 { 123 }\n' > src/src/lib.rs
          $WF build
          test -f target/hello.wasm
          $WF run
          echo "Rust toolchain test passed"

  cpp:
    name: C++ toolchain (clang++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (for wf binary)
        uses: dtolnay/rust-toolchain@stable
      - name: Install clang++ and wasi-sdk
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wasi-sdk
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-cpp-
      - name: Build wf binary
        run: cargo build --release -p wf-cli
      - name: Test C++ toolchain
        run: |
          set -euo pipefail
          WF=$(pwd)/target/release/wf
          mkdir -p toolchain-cpp
          cd toolchain-cpp
          printf 'schema = 1\n[package]\nname = "cpp-toolchain-test"\nversion = "0.1.0"\n[project]\nsource_dir = "src"\nentry = "_start"\n[[module]]\nname = "hello"\nsource = "src"\ntoolchain = "cpp"\n' > wasmfoundry.toml
          mkdir -p src
          printf 'extern "C" int _start() { return 456; }\n' > src/hello.cpp
          $WF build
          test -f target/hello.wasm
          $WF run
          echo "C++ toolchain test passed"

  assemblyscript:
    name: AssemblyScript toolchain (asc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (for wf binary)
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node.js and AssemblyScript
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install AssemblyScript
        run: npm install -g assemblyscript
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-as-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-as-
      - name: Build wf binary
        run: cargo build --release -p wf-cli
      - name: Test AssemblyScript toolchain
        run: |
          set -euo pipefail
          WF=$(pwd)/target/release/wf
          mkdir -p toolchain-as
          cd toolchain-as
          printf 'schema = 1\n[package]\nname = "as-toolchain-test"\nversion = "0.1.0"\n[project]\nsource_dir = "src"\nentry = "_start"\n[[module]]\nname = "hello"\nsource = "src"\ntoolchain = "assemblyscript"\n' > wasmfoundry.toml
          mkdir -p src
          printf 'export function _start(): i32 { return 789; }\n' > src/hello.ts
          $WF build
          test -f target/hello.wasm
          $WF run
          echo "AssemblyScript toolchain test passed"

  # Aggregate job
  toolchains:
    name: Toolchains Summary
    runs-on: ubuntu-latest
    needs: [rust, cpp, assemblyscript]
    if: always()
    steps:
      - name: Check all toolchain jobs passed
        run: |
          if echo "${{ needs.rust.result }}${{ needs.cpp.result }}${{ needs.assemblyscript.result }}" | grep -q "failure\|cancelled"; then
            echo "One or more toolchain jobs failed"
            exit 1
          fi
          echo "All toolchain tests passed"