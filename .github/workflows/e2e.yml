# WasmFoundry E2E Tests
#
# Runs the full wf workflow: init → build → run → inspect
# This validates the end-to-end user experience.

name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  e2e-precompiled:
    name: E2E - Precompiled WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-
      - name: Build wf binary
        run: cargo build --release -p wf-cli
      - name: Run E2E with precompiled toolchain
        run: |
          set -euo pipefail
          WF=$(pwd)/target/release/wf
          $WF init e2e-test
          cd e2e-test
          $WF build
          test -f target/hello.wasm
          $WF run
          $WF inspect target/hello.wasm
          $WF inspect target/hello.wasm --format json
          echo "Precompiled E2E passed"

  e2e-rust:
    name: E2E - Rust toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-
      - name: Build wf binary
        run: cargo build --release -p wf-cli
      - name: Run E2E with Rust toolchain
        run: |
          set -euo pipefail
          WF=$(pwd)/target/release/wf
          mkdir -p rust-e2e
          cd rust-e2e
          # Write wasmfoundry.toml
          printf 'schema = 1\n\n[package]\nname = "rust-e2e"\nversion = "0.1.0"\n\n[project]\nsource_dir = "src"\nentry = "_start"\n\n[[module]]\nname = "hello"\nsource = "src"\ntoolchain = "rust"\n' > wasmfoundry.toml
          # Write Cargo.toml
          mkdir -p src
          printf '[package]\nname = "hello"\nversion = "0.1.0"\nedition = "2021"\n\n[lib]\ncrate-type = ["cdylib"]\n' > src/Cargo.toml
          # Write lib.rs
          mkdir -p src/src
          printf '#[no_mangle]\npub extern "C" fn _start() -> i32 { 42 }\n' > src/src/lib.rs
          $WF build
          test -f target/hello.wasm
          $WF run
          $WF inspect target/hello.wasm
          echo "Rust toolchain E2E passed"

  e2e-multi-module:
    name: E2E - Multi-module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-
      - name: Build wf binary
        run: cargo build --release -p wf-cli
      - name: Run E2E with multi-module
        run: |
          set -euo pipefail
          WF=$(pwd)/target/release/wf
          mkdir -p multi-e2e
          cd multi-e2e
          # Write wasmfoundry.toml
          printf 'schema = 1\n\n[package]\nname = "multi-e2e"\nversion = "0.1.0"\n\n[project]\nsource_dir = "src"\nentry = "_start"\nmodule_matching = "file-name"\n\n[[module]]\nname = "engine"\nsource = "engine"\ntoolchain = "rust"\n\n[[module]]\nname = "app"\nsource = "app"\ntoolchain = "rust"\n' > wasmfoundry.toml
          # Engine module
          mkdir -p engine/src
          printf '[package]\nname = "engine"\nversion = "0.1.0"\nedition = "2021"\n\n[lib]\ncrate-type = ["cdylib"]\n' > engine/Cargo.toml
          printf '#[no_mangle]\npub extern "C" fn hello() -> i32 { 21 }\n' > engine/src/lib.rs
          # App module
          mkdir -p app/src
          printf '[package]\nname = "app"\nversion = "0.1.0"\nedition = "2021"\n\n[lib]\ncrate-type = ["cdylib"]\n' > app/Cargo.toml
          printf 'extern "C" { fn hello() -> i32; }\n\n#[no_mangle]\npub extern "C" fn _start() -> i32 { hello() * 2 }\n' > app/src/lib.rs
          $WF build
          test -f target/engine.wasm
          test -f target/app.wasm
          $WF run
          echo "Multi-module E2E passed"

  # Aggregate job
  e2e:
    name: E2E Summary
    runs-on: ubuntu-latest
    needs: [e2e-precompiled, e2e-rust, e2e-multi-module]
    if: always()
    steps:
      - name: Check all E2E jobs passed
        run: |
          if echo "${{ needs.e2e-precompiled.result }}${{ needs.e2e-rust.result }}${{ needs.e2e-multi-module.result }}" | grep -q "failure\|cancelled"; then
            echo "One or more E2E jobs failed"
            exit 1
          fi
          echo "All E2E tests passed"