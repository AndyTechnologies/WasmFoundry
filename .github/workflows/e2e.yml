name: E2E
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  e2e-precompiled:
    name: E2E - Precompiled WASM
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path:
        - ~/.cargo/registry
        - ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-cargo-
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-target-
    - name: Build wf binary
      run: cargo build --release -p wf-cli
    - name: Run E2E with precompiled toolchain
      run: 'set -euo pipefail

        WF=$(pwd)/target/release/wf

        $WF init e2e-test

        cd e2e-test

        $WF build

        test -f target/hello.wasm

        $WF run

        $WF inspect target/hello.wasm

        $WF inspect target/hello.wasm --format json

        echo "Precompiled E2E passed""'
    timeout-minutes: 30
  e2e-rust:
    name: E2E - Rust toolchain
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path:
        - ~/.cargo/registry
        - ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-cargo-
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-target-
    - name: Build wf binary
      run: cargo build --release -p wf-cli
    - name: Run E2E with Rust toolchain
      run: 'set -euo pipefail

        WF=$(pwd)/target/release/wf

        mkdir -p rust-e2e

        cd rust-e2e

        # Write wasmfoundry.toml

        cat > wasmfoundry.toml << ''EOF''

        schema = 1


        [package]

        name = "rust-e2e"

        version = "0.1.0"


        [project]

        source_dir = "src"

        entry = "_start"


        [[module]]

        name = "hello"

        source = "src"

        toolchain = "rust"

        EOF

        # Write Cargo.toml

        mkdir -p src

        cat > src/Cargo.toml << ''EOF''

        [package]

        name = "hello"

        version = "0.1.0"

        edition = "2021"


        [lib]

        crate-type = ["cdylib"]


        [workspace]

        EOF

        # Write lib.rs

        mkdir -p src/src

        cat > src/src/lib.rs << ''EOF''

        #[no_mangle]

        pub extern "C" fn _start() -> i32 { 42 }

        EOF

        $WF build

        test -f target/hello.wasm

        $WF run

        $WF inspect target/hello.wasm

        echo "Rust toolchain E2E passed""'
    timeout-minutes: 30
  e2e-multi-module:
    name: E2E - Multi-module
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path:
        - ~/.cargo/registry
        - ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-cargo-
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys:
        - ${{ runner.os }}-target-
    - name: Build wf binary
      run: cargo build --release -p wf-cli
    - name: Run E2E with multi-module
      run: 'set -euo pipefail

        WF=$(pwd)/target/release/wf

        mkdir -p multi-e2e

        cd multi-e2e

        # Write wasmfoundry.toml

        cat > wasmfoundry.toml << ''EOF''

        schema = 1


        [package]

        name = "multi-e2e"

        version = "0.1.0"


        [project]

        source_dir = "src"

        entry = "_start"

        module_matching = "file-name"


        [[module]]

        name = "engine"

        source = "engine"

        toolchain = "rust"


        [[module]]

        name = "app"

        source = "app"

        toolchain = "rust"

        EOF

        # Engine module

        mkdir -p engine/src

        cat > engine/Cargo.toml << ''EOF''

        [package]

        name = "engine"

        version = "0.1.0"

        edition = "2021"


        [lib]

        crate-type = ["cdylib"]


        [workspace]

        EOF

        cat > engine/src/lib.rs << ''EOF''

        #[no_mangle]

        pub extern "C" fn hello() -> i32 { 21 }

        EOF

        # App module

        mkdir -p app/src

        cat > app/Cargo.toml << ''EOF''

        [package]

        name = "app"

        version = "0.1.0"

        edition = "2021"


        [lib]

        crate-type = ["cdylib"]


        [workspace]

        EOF

        cat > app/src/lib.rs << ''EOF''

        extern "C" { fn hello() -> i32; }


        #[no_mangle]

        pub extern "C" fn _start() -> i32 { hello() * 2 }

        EOF

        $WF build

        test -f target/engine.wasm

        test -f target/app.wasm

        $WF run

        echo "Multi-module E2E passed""'
    timeout-minutes: 30
  e2e:
    name: E2E Summary
    runs-on: ubuntu-latest
    needs:
    - e2e-precompiled
    - e2e-rust
    - e2e-multi-module
    if: always()
    steps:
    - name: Check all E2E jobs passed
      run: "if echo \"${{ needs.e2e-precompiled.result }}${{ needs.e2e-rust.result }}${{ needs.e2e-multi-module.result }}\" | grep -q \"failure|cancelled\"; then\n  echo \"One or more E2E jobs failed\"\n\
        \  exit 1\nfi\necho \"All E2E tests passed\"\""
