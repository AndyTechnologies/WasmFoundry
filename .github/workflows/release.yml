# WasmFoundry Release
#
# Triggered on version tags (v*). Uses cargo-release to automate the release process.
# Based on conventional commits since last tag.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install cargo-release
        run: cargo install cargo-release --locked --version 2.62.0
      
      - name: Release via cargo-release
        run: cargo release --skip-tag --execute
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
