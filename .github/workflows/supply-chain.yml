# WasmFoundry Supply Chain
#
# Runs cargo-deny to verify licenses, duplicates, advisories, and sources.
# This is the supply chain gate from PHASE 19.

name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly to catch new advisories
    - cron: '0 0 * * 0'

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deny
          version: "0.20"
          locked: true
      - name: Run cargo deny check
        run: cargo deny check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          version: "0.22"
          locked: true
      - name: Run cargo audit
        run: cargo audit

  # Aggregate job
  supply-chain:
    name: Supply Chain Summary
    runs-on: ubuntu-latest
    needs: [deny, audit]
    if: always()
    steps:
      - name: Check all supply chain jobs passed
        run: |
          if echo "${{ needs.deny.result }}${{ needs.audit.result }}" | grep -q "failure\|cancelled"; then
            echo "One or more supply chain jobs failed"
            exit 1
          fi
          echo "All supply chain checks passed"