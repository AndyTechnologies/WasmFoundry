# WasmFoundry supply chain policy
#
# This file configures `cargo-deny` to enforce license compliance, detect
# duplicate dependencies, check for security advisories, and restrict
# dependency sources.
#
# Run locally: `cargo deny check`
# See: https://github.com/EmbarkStudios/cargo-deny

# Root options

[graph]
# Targets we build for
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "wasm32-wasip1",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# Security advisories from RustSec
[advisories]
# Use the official RustSec advisory database
#db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore specific advisories if they are false positives
ignore = []
# Use git CLI for fetching (better auth support)
git-fetch-with-cli = true

# License compliance
[licenses]
# Allowlist of acceptable licenses (SPDX identifiers)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
# Confidence threshold for license detection
confidence-threshold = 0.8
# Ignore private/unpublished workspace crates
private = { ignore = false, registries = [] }

# Duplicate detection
[bans]
# Allow semver-compatible duplicates
multiple-versions = "warn"
# Allow wildcard version requirements
wildcards = "allow"
# Highlight all paths to duplicates
highlight = "all"
# Allow default features for workspace and external crates
workspace-default-features = "allow"
external-default-features = "allow"
# Skip tree for certain crates if needed
skip = []
skip-tree = []

# Source restrictions
[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Allow-list for git organizations (if we ever need git deps)
[sources.allow-org]
github = []
gitlab = []
bitbucket = []