[package]
name = "wf-cli"
description = "The wf command line interface for WasmFoundry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wf"
path = "src/main.rs"

[dependencies]
# Command line parsing. Derive is the only style used: the argument surface is
# the type, so `--help` cannot drift from the real parser.
clap = { workspace = true }

# Binary analysis for `wf inspect` (PHASE 3). The runtime is deliberately not a
# dependency yet: `inspect` must never be able to execute the binary it reads,
# and the simplest way to guarantee that is for the execution crate to be absent
# from this build graph.
wf-wasm = { workspace = true }

# Execution for `wf run` (PHASE 4). Depending on this crate is how the CLI gets a
# runtime: no Wasmtime type reaches this crate, so the engine binding stays private to
# `wf-runtime`.
wf-runtime = { workspace = true }

# The entry point is a domain value, not a bare string the runtime happens to look for.
wf-core = { workspace = true }

# Serialisation for `--format json`. It lives here and not in the analysis crate:
# the JSON document is an interface of this binary, not a property of the domain.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Test-only: fixtures are assembled from readable WAT source, and end-to-end tests parse
# the JSON the binary actually prints.
wat = "1.238"
serde_json = "1"

